version: '3.8'

services:
  ai:
    container_name: nextgen-ai
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - nginx_conf:/etc/nginx/conf.d
    networks:
      - nextgen-network

  ai-blue:
    container_name: ai-blue
    build:
      context: .
      dockerfile: Dockerfile
    image: nextgen-ai:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3.2G
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf_models_cache:/app/models
    networks:
      - nextgen-network

  ai-green:
    container_name: ai-green
    build:
      context: .
      dockerfile: Dockerfile
    image: nextgen-ai:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3.2G
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf_models_cache:/app/models
    networks:
      - nextgen-network

volumes:
  hf_models_cache:
    name: nextgen-ai-models
  nginx_conf:
    name: nextgen-ai-nginx-conf

networks:
  nextgen-network:
    external: true
